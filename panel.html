<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="hd">
    <div class="logo" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>하이라이터</h1>
    <span class="side-label">하이라이트 표시</span>
    <span class="sp"></span>
    <label class="switch" title="전체 켜기/끄기">
      <input type="checkbox" id="enabled">
      <span></span>
    </label>
    <button id="mode" class="ib">
      <svg class="i to-popup" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16"/><path d="m8 10 2 2-2 2"/></svg>
      <svg class="i to-side" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/><path d="M18 8v8" stroke-width="3"/></svg>
    </button>
    <button id="close" class="ib" title="닫기">
      <svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </header>

  <form id="add-form" class="in">
    <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    <input id="word-input" type="text" placeholder="단어 입력 · 쉼표로 여러 개" autocomplete="off">
    <button type="submit" class="btn">추가</button>
  </form>

  <p id="hint" class="hint" hidden></p>

  <div class="opts">
    <label class="cb"><input type="checkbox" id="caseSensitive"><span></span>대소문자 구분</label>
    <label class="cb"><input type="checkbox" id="wholeWord"><span></span>단어 단위로만</label>
    <span class="sp"></span>
    <button id="clear" class="link">모두 삭제</button>
  </div>

  <div class="sec">
    <span>등록한 단어 <span id="word-count">0</span></span>
    <span>이 페이지 <b id="page-total">0</b>건</span>
  </div>

  <div id="word-list" class="chips"></div>
  <p id="empty" class="empty">표시할 단어를 위에 입력하세요.</p>

  <section id="card" class="card" hidden>
    <div class="row">
      <span id="card-dot" class="dot"></span>
      <b id="card-name"></b>
      <span id="card-pos" class="pos"></span>
    </div>
    <div class="acts">
      <button id="prev" class="act grow" title="이전 위치">
        <svg class="i" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>이전
      </button>
      <button id="next" class="act grow primary" title="다음 위치">
        다음<svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button id="toggle-word" class="act sq">
        <svg class="i eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="i eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.4 5.2A9.8 9.8 0 0 1 12 5c5 0 9 4.5 10 7a12 12 0 0 1-2.6 3.6M6.1 6.1C4 7.5 2.6 9.6 2 12c1 2.5 5 7 10 7a9.6 9.6 0 0 0 4.4-1"/></svg>
      </button>
      <label class="act sq" title="색상 변경">
        <span id="card-swatch" class="swatch"></span>
        <input type="color" id="card-color">
      </label>
    </div>
  </section>

  <p id="notice" class="notice" hidden>이 페이지에서는 동작하지 않거나, 새로고침(F5)이 필요합니다.</p>

  <footer class="ft">
    <span id="site"></span>
  </footer>

  <div id="confirm" class="backdrop" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-body">
      <p id="confirm-title" class="dialog-title"></p>
      <p id="confirm-body" class="dialog-body"></p>
      <div class="acts">
        <button id="confirm-cancel" class="act grow">취소</button>
        <button id="confirm-ok" class="act grow danger"></button>
      </div>
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
